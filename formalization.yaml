version: v0.4
project:
  name: Low-dimensional exact counterexamples to the Recht–Ré inequality
  description: >-
    Five real symmetric PSD 3×3 integer matrices and five complex Hermitian
    PSD 2×2 Gaussian-integer matrices each have sum 100I and exact
    norm-of-averaged-product ratio 10329/10000 at n=k=5. The Lean
    statements use Mathlib positive semidefiniteness over the real and
    complex fields and the Euclidean operator norm. The rational
    formalization of De Sa's dimension-five norm-19/16 example is included
    as a supporting benchmark. The real symmetric dimension-two case is not resolved.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.OC, math.FA]
  msc2020: ["15A45", "15A60", "47A30"]
sources:
  - title: Exact real 3×3 and complex 2×2 counterexamples to the Recht–Ré inequality
    type: original-proof
    authors: [JD Jones]
    relationship: other
    location: note/LOW_DIMENSION.md
    note: >-
      This project first presents its exact real dimension-three and complex
      dimension-two examples. note/LOW_DIMENSION.md accompanies this same
      original development, with elementary product formulas and supplementary
      family analysis; it is not a distinct prior source work being formalized.
      This provenance classification does not assert worldwide priority. The compared
      declarations are two existential real/complex counterexamples;
      general parameter and optimization results are not additional
      compared Lean claims.
  - title: Random Reshuffling is Not Always Better
    type: paper
    authors: [Christopher De Sa]
    year: 2020
    relationship: background
    note: >-
      NeurIPS 2020. Source of the dimension-five benchmark matrices,
      exact averaged-product formula, exact spectrum and ratio 19/16.
      These mathematical values were already explicit in De Sa's paper and
      are adapted as a supporting formalized benchmark. The original compared
      real construction here reduces the dimension of that benchmark; the
      dimension-five result is not one of the two compared declarations.
  - title: Toward a Noncommutative Arithmetic-Geometric Mean Inequality
    type: paper
    authors: [Benjamin Recht, Christopher Ré]
    year: 2012
    relationship: background
    note: >-
      COLT 2012, Conjecture 1, formula (8). The present result concerns
      the norm of the averaged ordered product, not formula (9).
  - title: Recht–Ré Noncommutative Arithmetic-Geometric Mean Conjecture is False
    type: paper
    authors: [Zehua Lai, Lek-Heng Lim]
    year: 2020
    relationship: background
    note: ICML 2020; nonconstructive five-factor disproof and low-length results.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI GPT, Claude (Anthropic), and Grok (xAI)
      notes: >-
        AI assistance was used for research, computation, writing, and
        formalization. OpenAI GPT prepared the final manuscript and
        formalization package. Finite integer and Gaussian-integer products
        use ordinary kernel decide and standard Mathlib positivity and
        Euclidean operator-norm results. No native_decide is used.
review:
  status: agent-reviewed
  notes: >-
    Exact permutation enumeration, an independent subset recurrence for
    the real witness, symbolic coefficient checks, and formal statements
    are available for review. Automated checks and AI-assisted review
    are not external human peer review. Release verification must be
    established by exact-commit Linux CI.
fidelity:
  divergences: >-
    Two Mathlib-only challenge contracts assert existential real 3x3
    and complex 2x2 counterexamples, with standard permutation sums,
    PSD, scalar sums, full Euclidean operator norms, strict failure,
    and exact ratio 10329/10000. Concrete witness lemmas and the rational
    De Sa dimension-five benchmark are supporting library results.
    Rank descriptions, scalar dimension-one exclusion, parameterized
    families, family-specific optima, padding, positive definite
    perturbations, and optimization applications are supplementary
    written proofs, not additional compared Lean claims. No unrestricted
    real 2x2 exclusion, separate palindromic disproof, or global optimum
    over matrix tuples is claimed.
